services:
  - type: web
    name: answerdoctor-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: answerdoctor-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://answerdoctor-omega.vercel.app
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ANSWERDOCTOR_SEED_DEMO
        value: "false"

databases:
  - name: answerdoctor-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: answerdoctor
    user: answerdoctor
    ipAllowList: []
