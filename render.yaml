services:
  - type: web
    name: answerdoctor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://answerdoctor.vercel.app
      - key: ANSWERDOCTOR_SEED_DEMO
        value: "false"
